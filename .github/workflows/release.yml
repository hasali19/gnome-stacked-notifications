name: Release

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install gnome-extensions tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin jq

      - name: Pack extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir=dist .
          ls -l dist

      - name: Compute release tag
        id: info
        run: |
          version=$(jq -r '."version-name" // .version // "0"' metadata.json)
          echo "tag=v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  release:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension zip
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pack.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.shell-extension.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
